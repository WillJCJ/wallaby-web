---
layout: layouts/base.html
title: Guest Admin - Wallaby Fest
---
<div class="page-intro">
  <h2>Guest Admin</h2>
  <p>View and add guest records. Admin users only.</p>
</div>

<section class="private-details" id="guest-admin" aria-live="polite">
  <p class="private-status" id="guest-admin-status">Loading guests...</p>

  <section class="admin-requests-panel" id="admin-requests-panel" hidden>
    <h3>Pending Requests</h3>
    <div class="admin-requests-table-wrap">
      <table class="admin-guests-table admin-requests-table">
        <colgroup>
          <col class="admin-request-col admin-request-col--name">
          <col class="admin-request-col admin-request-col--email">
          <col class="admin-request-col admin-request-col--requested">
          <col class="admin-request-col admin-request-col--actions">
        </colgroup>
        <thead>
          <tr>
            <th>Name</th>
            <th class="admin-request-column-email">Email</th>
            <th>Requested</th>
            <th class="admin-request-column-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-requests-list"></tbody>
      </table>
    </div>

    <template id="admin-request-template">
      <tr>
        <td colspan="4" class="admin-request-item-cell">
          <details class="admin-request-item" name="admin-request-item">
            <summary class="admin-request-summary">
              <span class="admin-request-name"></span>
              <span class="admin-request-summary-email admin-request-column-email"></span>
              <span class="admin-request-time"></span>
              <span class="admin-request-summary-actions admin-request-column-actions">
                <button type="button" class="login-button admin-request-create-button admin-request-create-button--summary">Add</button>
                <button type="button" class="login-button admin-request-dismiss-button admin-request-dismiss-button--summary">Dismiss</button>
              </span>
            </summary>
            <div class="admin-request-detail">
              <p class="admin-request-email"></p>
              <div class="admin-request-actions">
                <button type="button" class="login-button admin-request-create-button admin-request-create-button--detail">Add</button>
                <button type="button" class="login-button admin-request-dismiss-button admin-request-dismiss-button--detail">Dismiss</button>
              </div>
            </div>
          </details>
        </td>
      </tr>
    </template>
  </section>

  <div class="admin-rsvp-stats" id="admin-rsvp-stats" hidden></div>

  <section class="admin-add-panel" id="admin-add-panel" hidden>
    <p class="private-status admin-form-status" id="guest-admin-form-status" hidden aria-live="polite"></p>
    <button type="button" class="login-button" id="guest-admin-toggle">Add guest</button>

    <form class="guest-profile-form admin-guest-form-compact" id="guest-admin-form" hidden>
      <h3>Create Guest</h3>

      <div class="admin-form-row">
        <div class="admin-form-field">
          <label for="admin-guest-name">Name</label>
          <input id="admin-guest-name" name="name" type="text" required maxlength="120" />
        </div>
        <div class="admin-form-field">
          <label for="admin-guest-rsvp">RSVP</label>
          <select id="admin-guest-rsvp" name="rsvp" required>
            <option value="pending">Pending</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>

      <div class="admin-form-row">
        <div class="admin-form-field">
          <label for="admin-guest-email">Email</label>
          <input id="admin-guest-email" name="email" type="email" required maxlength="320" />
        </div>
        <div class="admin-form-field admin-form-field--narrow">
          <label for="admin-guest-additional-guests">Extra guests</label>
          <input id="admin-guest-additional-guests" name="additionalGuests" type="number" min="0" step="1" value="0" />
        </div>
      </div>

      <div class="admin-add-form-actions">
        <button type="submit" class="login-button" id="guest-admin-submit">Create</button>
        <button type="button" class="login-button" id="guest-admin-cancel">Cancel</button>
      </div>
    </form>
  </section>

  <div class="admin-guests-list" id="admin-guests-list" hidden></div>

  <section class="admin-sync-panel" id="admin-sync-panel" hidden>
    <h3>Access Policy Sync</h3>
    <p class="admin-sync-summary" id="admin-sync-summary">Checking sync status...</p>
    <div class="admin-sync-actions">
      <button type="button" class="login-button" id="admin-sync-run">Run sync</button>
      <button type="button" class="login-button" id="admin-sync-dry-run">Dry run</button>
      <button type="button" class="login-button" id="admin-sync-refresh">Refresh status</button>
    </div>
  </section>
</section>

<script type="module" src="/scripts/admin.js"></script>
