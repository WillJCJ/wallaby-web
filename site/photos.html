---
layout: layouts/base.html
title: Photos — Wallaby Fest
---
<div class="page-intro">
  <h2>Photos</h2>
  <p>Previous festival highlights.</p>
</div>

<section class="photos-gallery" id="photos-top">
  {% for photo in photos %}
  <article id="photo-{{ forloop.index }}" class="photo-item" style="--lqip: url('/cdn-cgi/image/width=40,quality=5,format=auto/api/photos/{{ photo.id }}')">  

    <a href="#photo-{{ forloop.index }}" class="photo-thumb-link" aria-label="{{ photo.alt }}">
      <img
        src="/cdn-cgi/image/width=600,quality=80,format=auto/api/photos/{{ photo.id }}"
        alt="{{ photo.alt }}"
        loading="{% if forloop.index <= 12 %}eager{% else %}lazy{% endif %}"
        fetchpriority="{% if forloop.index <= 4 %}high{% else %}auto{% endif %}"
        decoding="async"
      >
    </a>

    <div class="photo-lightbox">
      <a href="#photos-top" class="lightbox-close" aria-label="Close"></a>
      <figure class="lightbox-figure">
        <img
          src="/cdn-cgi/image/width=2000,quality=85,format=auto/api/photos/{{ photo.id }}"
          alt="{{ photo.alt }}"
          loading="lazy"
          decoding="async"
        >
        {% if photo.caption %}<figcaption class="lightbox-caption">{{ photo.caption }}</figcaption>{% endif %}
      </figure>
      {% unless forloop.first %}
      <a href="#photo-{{ forloop.index | minus: 1 }}" class="lightbox-nav lightbox-nav--prev" aria-label="Previous photo">&#8249;</a>
      {% endunless %}
      {% unless forloop.last %}
      <a href="#photo-{{ forloop.index | plus: 1 }}" class="lightbox-nav lightbox-nav--next" aria-label="Next photo">&#8250;</a>
      {% endunless %}
    </div>

  </article>
  {% endfor %}
</section>
