<div class="page-intro">
  <h2>Your Profile</h2>
  <p>Your guest details are loaded from your authenticated account.</p>
</div>

<section class="private-details" id="guest-profile" aria-live="polite">
  <p class="private-status" id="guest-profile-status">Loading your profile...</p>

  <dl class="private-list" id="guest-profile-list" hidden>
    <div class="private-item">
      <dt>Name</dt>
      <dd id="guest-name"></dd>
    </div>
    <div class="private-item">
      <dt>Email</dt>
      <dd id="guest-email"></dd>
    </div>
    <div class="private-item">
      <dt>RSVP</dt>
      <dd id="guest-rsvp"></dd>
    </div>
    <div class="private-item">
      <dt>Additional guests</dt>
      <dd id="guest-additional-guests"></dd>
    </div>
    <div class="private-item">
      <dt>Dietary requirements</dt>
      <dd id="guest-dietary-requirements"></dd>
    </div>
    <div class="private-item">
      <dt>RSVP message</dt>
      <dd id="guest-rsvp-message"></dd>
    </div>
  </dl>
</section>

<script src="/scripts/profile.js" defer></script>
