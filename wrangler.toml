#:schema node_modules/wrangler/config-schema.json
name = "wallaby-web"
compatibility_date = "2026-04-01"
main = "worker/router.js"

[build]
command = "npm run build"

[[routes]]
pattern = "wallabyfest.co.uk"
custom_domain = true

[assets]
directory = "dist"
not_found_handling = "404-page"

[env.production]

[[env.production.d1_databases]]
binding = "GUESTS_DB"
database_name = "wallabyfest-guests"
database_id = "fc8fca57-d92e-40c7-85a6-0459263f4fef"

[env.preview]
workers_dev = true

[[env.preview.d1_databases]]
binding = "GUESTS_DB"
database_name = "wallabyfest-guests-preview"
database_id = "REPLACE_WITH_PREVIEW_DATABASE_ID"
