#:schema node_modules/wrangler/config-schema.json
name = "wallaby-web"
compatibility_date = "2026-04-01"
main = "worker/router.js"

workers_dev = false
preview_urls = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
LOG_LEVEL = "info"

[build]
command = "npm run build"

[assets]
directory = "dist"
not_found_handling = "404-page"

[observability.logs]
enabled = true
invocation_logs = true

[env.production]
workers_dev = false
preview_urls = false

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.production.routes]]
pattern = "wallabyfest.co.uk"
custom_domain = true

[[env.production.d1_databases]]
binding = "GUESTS_DB"
database_name = "wallabyfest-guests"
database_id = "fc8fca57-d92e-40c7-85a6-0459263f4fef"

[env.preview]
workers_dev = true
preview_urls = true

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
LOG_LEVEL = "debug"

[[env.preview.d1_databases]]
binding = "GUESTS_DB"
database_name = "wallabyfest-guests-preview"
database_id = "e051dc73-8940-4dcc-b670-572c94d0bd07"
