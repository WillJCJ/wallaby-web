<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦘 Wallaby Fest 🦘</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff6b6b;
            font-size: 3em;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        .party-time {
            background: #feca57;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .celebrate {
            font-size: 4em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="celebrate">🎉</div>
        <h1>Wallaby Fest</h1>
        <p class="subtitle">!</p>
        <div class="party-time">
            <p>🥳 Let's Party! 🥳</p>
            <p>🎂 Celebrating another amazing year! 🎂</p>
        </div>
        <p>Thanks for celebrating with me!</p>
    </div>
</body>
</html>
