name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKER_NAME: wallaby-web-preview
  WORKERS_SUBDOMAIN: willjcjohnson

jobs:
  deploy-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Preview
    outputs:
      alias: ${{ steps.preview-meta.outputs.alias }}
      preview_url: ${{ steps.deploy-preview.outputs.preview_url }}
      short_sha: ${{ steps.preview-meta.outputs.short_sha }}
      commit_time: ${{ steps.preview-meta.outputs.commit_time }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - id: preview-meta
        name: Derive preview alias
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bash ./.github/scripts/derive-preview-meta.sh

      - id: deploy-preview
        name: Deploy preview alias
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: ${{ steps.preview-meta.outputs.alias }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ steps.preview-meta.outputs.short_sha }}
        run: bash ./.github/scripts/deploy-preview-alias.sh

  comment-preview:
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && needs.deploy-preview.result == 'success'
    needs: deploy-preview
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create or update preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          SHORT_SHA: ${{ needs.deploy-preview.outputs.short_sha }}
          COMMIT_TIME: ${{ needs.deploy-preview.outputs.commit_time }}
        with:
          script: |
            const run = require('./.github/scripts/create-or-update-preview-comment.cjs');
            await run({ github, context, core });
