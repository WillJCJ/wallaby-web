name: Lint, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKER_NAME: ${{ secrets.WORKER_NAME }}
  WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}

jobs:
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - run: npm run lint
      
      - run: npm test

  preview-deploy:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: lint
    runs-on: ubuntu-latest
    environment: Preview
    outputs:
      alias: ${{ steps.preview-meta.outputs.alias }}
      preview_url: ${{ steps.preview-meta.outputs.preview_url }}
      short_sha: ${{ steps.preview-meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - id: preview-meta
        name: Derive preview alias and URL
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
          branch_slug="$(echo "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
          if [ -z "$branch_slug" ]; then
            branch_slug="preview"
          fi

          branch_slug="${branch_slug:0:32}"
          branch_hash="$(printf '%s' "$branch" | shasum -a 256 | cut -c1-6)"
          alias="pr-${branch_slug}-${branch_hash}"
          alias="${alias:0:48}"
          short_sha="${GITHUB_SHA::7}"
          preview_url="https://${alias}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"

          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload preview version with alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --env preview \
            --preview-alias "${{ steps.preview-meta.outputs.alias }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ steps.preview-meta.outputs.short_sha }}"

  preview-lighthouse:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: preview-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - name: Run Lighthouse against preview URL
        run: |
          base_url="${{ needs.preview-deploy.outputs.preview_url }}"
          npx lhci autorun --config=config/lighthouserc.preview.json \
            --collect.url="$base_url/" \
            --collect.url="$base_url/festival-map" \
            --collect.url="$base_url/wallabies" \
            --collect.url="$base_url/game"

  preview-comment:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && always() && needs.preview-deploy.result == 'success'
    needs: [preview-deploy, preview-lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Create or update preview comment
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- wallaby-preview-url -->';
            const previewUrl = '${{ needs.preview-deploy.outputs.preview_url }}';
            const shortSha = '${{ needs.preview-deploy.outputs.short_sha }}';
            const lighthouseResult = '${{ needs.preview-lighthouse.result }}';
            const body = [
              marker,
              '## Preview deployment',
              '',
              `- Preview URL: ${previewUrl}`,
              `- Commit: ${shortSha}`,
              `- Lighthouse (preview): ${lighthouseResult}`
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

  production-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  production-lighthouse:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - run: npm ci

      - run: npm run lighthouse
